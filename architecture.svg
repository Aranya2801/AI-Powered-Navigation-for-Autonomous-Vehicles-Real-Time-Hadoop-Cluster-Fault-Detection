<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Module 1 architecture diagram</title>
<desc>Simulated sensors (LiDAR, GPS, IMU) feed an Extended Kalman Filter, which produces a fused state estimate. This estimate, plus a relative bearing feature, forms the policy observation. The observation goes either to the PPO policy or to classical planners (A*, RRT). Both produce actions that drive the navigation environment, which is evaluated by the benchmark harness.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="30" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">LiDAR</text>
<text x="115" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">36 beams, noise, dropout</text>

<rect x="210" y="30" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="285" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">GPS</text>
<text x="285" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Noise, bias drift</text>

<rect x="380" y="30" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="455" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">IMU</text>
<text x="455" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Heading, speed, bias</text>

<path d="M115 86 L115 110 L335 110" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="285" y1="86" x2="285" y2="122" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M455 86 L455 110 L335 110" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="215" y="122" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="335" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Extended Kalman Filter</text>
<text x="335" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Fused state estimate</text>

<line x1="335" y1="178" x2="335" y2="206" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="195" y="206" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="335" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Observation vector</text>
<text x="335" y="244" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">State, bearing, LiDAR ranges</text>

<path d="M260 262 L150 290" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M410 262 L520 290" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="290" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">PPO policy</text>
<text x="150" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">BC warm start + RL fine-tune</text>

<rect x="420" y="290" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="530" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Classical planners</text>
<text x="530" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">A*, RRT, replanning</text>

<path d="M150 346 L150 370 L335 370" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M530 346 L530 370 L335 370" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="215" y="370" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="335" y="390" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Navigation environment</text>
<text x="335" y="408" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Held-out benchmark, seed 100000+</text>
</svg>
